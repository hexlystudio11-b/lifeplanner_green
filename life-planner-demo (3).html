function sim(ex){let d=S.debts.filter(x=>x.bal>0).map(x=>({b:x.bal,r:x.apr/1200,m:x.min}));if(!d.length)return{m:0,ti:0};
 const T=d.reduce((s,x)=>s+x.m,0)+ex;let m=0,ti=0;
 while(d.some(x=>x.b>0)&&m<1200){m++;d.forEach(x=>{if(x.b>0){const i=x.b*x.r;ti+=i;x.b+=i}});let left=T;
  d.forEach(x=>{if(x.b>0){const p=Math.min(x.m,x.b);x.b-=p;left-=p}});
  [...d].sort((a,b)=>b.r-a.r).forEach(x=>{if(left>0&&x.b>0){const p=Math.min(left,x.b);x.b-=p;left-=p}});d.forEach(x=>{if(x.b<.005)x.b=0})}
 return d.some(x=>x.b>0)?null:{m,ti}}
